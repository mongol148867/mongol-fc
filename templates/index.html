<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mongol Filechange</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #10131a; color: #f3f5f9;
    }
    main {
      width: min(100%, 520px); padding: 32px; border: 1px solid #303746;
      border-radius: 22px; background: #191e29; box-shadow: 0 24px 70px #0005;
    }
    .brand { display: flex; justify-content: center; margin: 0 auto 18px; }
    .brand img { display: block; width: min(100%, 300px); height: auto; object-fit: contain; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 36px); }
    p { color: #aeb8ca; line-height: 1.55; }
    .drop {
      display: block; margin: 24px 0 14px; padding: 26px 18px;
      border: 2px dashed #68758c; border-radius: 14px; text-align: center;
      background: #202735; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .drop.dragover { border-color: #7c9cff; background: #293650; }
    .drop-hint { display: block; margin-top: 8px; color: #aeb8ca; font-size: 13px; }
    .file-name { display: block; margin-top: 10px; color: #cbd8ff; overflow-wrap: anywhere; }
    input[type=file] { display: block; width: 100%; margin-top: 14px; color: #cdd5e3; cursor: pointer; }
    button, .link {
      display: inline-block; border: 0; border-radius: 11px; padding: 12px 17px;
      background: #7c9cff; color: #111827; font-weight: 750; font-size: 15px;
      text-decoration: none; cursor: pointer;
    }
    button { width: 100%; margin-top: 8px; }
    .result, .error { margin-top: 22px; padding: 18px; border-radius: 13px; }
    .result { background: #172f2a; border: 1px solid #2f6959; }
    .error { background: #3a2025; border: 1px solid #75404a; color: #ffdce1; }
    .code { font-size: 36px; font-weight: 800; letter-spacing: 5px; margin: 6px 0 14px; }
    .small { font-size: 13px; color: #9eabc0; }
    a { color: #b9caff; overflow-wrap: anywhere; }
    .link { color: #111827; }
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="{{ url_for('static', filename='filechange.png') }}" alt="mongol filechange"></div>
  <h1>Mongol Filechange</h1>
  <p>Загрузи файл и получи короткую ссылку для скачивания.</p>

  <form action="/upload" method="post" enctype="multipart/form-data">
    <label class="drop" id="drop-zone">
      <strong>Перетащи файл сюда</strong>
      <span class="drop-hint">или нажми, чтобы выбрать его на компьютере</span>
      <input id="file-input" type="file" name="file" required>
      <span class="file-name" id="file-name">Файл не выбран</span>
    </label>
    <button type="submit">Загрузить файл</button>
  </form>
  <p class="small">Максимальный размер одного файла: {{ max_upload_mb }} МБ.</p>

  <script>
    (() => {
      const zone = document.getElementById('drop-zone');
      const input = document.getElementById('file-input');
      const fileName = document.getElementById('file-name');

      function showFile(file) {
        fileName.textContent = file ? `Выбран файл: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} МБ)` : 'Файл не выбран';
      }

      input.addEventListener('change', () => showFile(input.files[0]));
      for (const eventName of ['dragenter', 'dragover']) {
        zone.addEventListener(eventName, event => {
          event.preventDefault();
          zone.classList.add('dragover');
        });
      }
      for (const eventName of ['dragleave', 'drop']) {
        zone.addEventListener(eventName, event => {
          event.preventDefault();
          zone.classList.remove('dragover');
        });
      }
      zone.addEventListener('drop', event => {
        const files = event.dataTransfer && event.dataTransfer.files;
        if (!files || !files.length) return;
        try {
          input.files = files;
          showFile(input.files[0]);
        } catch (_) {
          fileName.textContent = 'Не удалось выбрать файл. Нажми сюда и выбери его вручную.';
        }
      });
    })();
  </script>

  {% if code %}
  <section class="result">
    <div>Файл загружен! Код для скачивания:</div>
    <div class="code">{{ code }}</div>
    <p><a href="{{ download_url }}">{{ download_url }}</a></p>
    <button type="button" onclick="copyLink()">Скопировать ссылку</button>
    <p class="small">Ссылка откроет скачивание файла.</p>
  </section>
  <script>
    function copyLink() {
      navigator.clipboard.writeText({{ download_url|tojson }})
        .then(() => alert('Ссылка скопирована'))
        .catch(() => prompt('Скопируйте ссылку:', {{ download_url|tojson }}));
    }
  </script>
  {% endif %}

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
</main>
</body>
</html>
